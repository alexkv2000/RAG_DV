server:
  address: 0.0.0.0
  tomcat:
    max-part-header-size: 8KB # снимает ограничение размера заголовка файла для /api/rag/extract
  servlet:
    session:
      timeout: 600m   # 10 часов, как в ProtocolMenagment
spring:
  ldap:
    urls: ldap://gaz.ru:389
  servlet:
    multipart:            # Spring Boot 4.x — свойство здесь
      max-file-size: 64MB
      max-request-size: 64MB
  application.name: rag-indexer
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true    # всегда сверять с сервером (ETag/304), не брать из кэша вслепую
  datasource:
    url: jdbc:sqlserver://${DB_SERVER}:1433;databaseName=GAZ;encrypt=true;trustServerCertificate=true;packetSize=32767
    username: ${DB_USER}
    password: ${DB_PASSWORD}
ldap:
  admin:
    username: DVStorage@gaz.ru
    password: ${LDAP_PASSWORD}
  base-dn: dc=gaz,dc=ru                 # корень поиска в AD
  user-search-filter: (sAMAccountName={0})
rag:
  rerank: # стадия-2 поиска: кросс-энкодер переупорядочивает кандидатов Chroma
    enabled: true               # false - включить после скачивания модели - true (readmy.txt, раздел «Реранкер»)
    model: BAAI/bge-reranker-v2-m3
    path: C:\models\bge-reranker-v2-m3   # model.onnx (или onnx\model.onnx) + tokenizer.json
    max-tokens: 512
    batch: 8                     # пар «вопрос, фрагмент» за один прогон ONNX (память/скорость)
    passages: 16                 # Default - 32. сколько верхних кандидатов или кандидатов реранчить в первую волну
    min-score: 0.05        # < 0.05 — ниже(мусор): не идёт ни в контекст, ни в источники
  ui:
    doc-card-url: https://${SERVER_DB_LINK}/DocsvisionWebClient/#/CardView/211CAF82-2949-4861-B4D0-238D373F951C?FileId=
  chunk:
    target-chars: 650      # Было 400 (мах 700 дальше будет резать вектор) (лимит 512 токенов модели)
    overlap-chars: 80
  embedding:
    local-model: intfloat/multilingual-e5-small
    local-path: C:\models\multilingual-e5-small
    passage-prefix: "passage: "
    query-prefix: "query: "
    dims: 384
    batch: 16 # для ПРОД - 64
  chroma:
    base-url: http://127.0.0.1:8000
    collection: rag_chunks
  ocr:
    enabled: true        # включить после установки tessdata
    lang: rus+eng
    dpi: 200
    max-pages: 30
    data-path: C:/tessdata/
  llm:
    base-url: https://ai.loodsen.ru/api/v1 #https://ai.loodsen.ru/api/v1/chat/completions
    direct-max-file-mb: 32        # Потолок размера одного файла 'Свободного чата' (макс. 64 — потолок multipart в UploadConfig)
    direct-max-files: 3           # Файлов на сессию свободного чата
    direct-max-file-chars: 350000 # все что выше 400 000 режется (direct-max-session-tokens × 2 симв. за ток.) / 3 файла
    direct-max-session-tokens: 120000  # Оценка токенов на ВСЕ файлы сессии
    direct-clear-files-after-reply: false # true → файл «одноразовый»: после ответа LLM открепляется, текст удаляется из памяти
    api-key: ${LOODSEN_API_KEY}
    model: Qwen3.8-27B
    temperature: 0.2
    max-tokens: 4096
    timeout-seconds: 300
    history-turns: 3
    context-chunks: 10 #было 6 Проверка ёмкости: 10 чанков × ≤1200 симв. = 12 000 ≤ MAX_CONTEXT_CHARS (15 000) — влезает. n_results=40 для ChromaDB — нормально.
    candidate-chunks: 40 #было 24
    disable-thinking: true
    compare-enabled: true        # false — полностью выключить сценарий сравнения
    compare-chunks-per-side: 8   # Фрагментов на каждую версию при сравнении(бюджет 15 000 символов режет лишнее сам)
    session-ttl-minutes: 30   # TTL неактивной сессии чата (RAG + свободный) 30 минут; 0 — бессрочно
  content:
    max-file-mb: 32   # опционально: снижает потолок RAM, не меняя код
    roots: # имя стора (dvsys_binary_storages.Name)
      # NTFS-стор: имя → корень шары
      OfficeWork: '\\gaz\docsvision\DVStream\OfficeWork'
      # архивные БД: имя → JDBC-URL
      Archive_2019: 'jdbc:sqlserver://${SERVER_ARC};databaseName=GAZ_Archive_2019;user=${DBArcv_USER};password=${DBArh_PASSWORD};encrypt=false;trustServerCertificate=true'
      Archive_2020: 'jdbc:sqlserver://${SERVER_ARC};databaseName=GAZ_Archive_2020;user=${DBArcv_USER};password=${DBArh_PASSWORD};encrypt=false;trustServerCertificate=true'
      Archive_2021: 'jdbc:sqlserver://${SERVER_ARC};databaseName=GAZ_Archive_2021;user=${DBArcv_USER};password=${DBArh_PASSWORD};encrypt=false;trustServerCertificate=true'
      Archive_2022: 'jdbc:sqlserver://${SERVER_ARC};databaseName=GAZ_Archive_2022;user=${DBArcv_USER};password=${DBArh_PASSWORD};encrypt=false;trustServerCertificate=true'
      Archive_2023: 'jdbc:sqlserver://${SERVER_ARC};databaseName=GAZ_Archive_2023;user=${DBArcv_USER};password=${DBArh_PASSWORD};encrypt=false;trustServerCertificate=true'
      Archive_2024: 'jdbc:sqlserver://${SERVER_ARC};databaseName=GAZ_Archive_2024;user=${DBArcv_USER};password=${DBArh_PASSWORD};encrypt=false;trustServerCertificate=true'
logging:
  level:
    kvo.itsnn.rag: INFO
    org.apache.poi: ERROR
