<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>RAG-чат</title><style>
    body{font-family:"Segoe UI",sans-serif;max-width:780px;margin:24px auto;background:#f5f6f8;padding:0 12px}
    h3{color:#334}
    #chat{display:flex;flex-direction:column;gap:10px;height:60vh;overflow-y:auto;padding:12px;
        background:#fff;border:1px solid #ddd;border-radius:8px}
    .m{padding:8px 12px;border-radius:10px;max-width:88%;white-space:pre-wrap;line-height:1.4}
    .u{align-self:flex-end;background:#dcf8c6}
    .a{align-self:flex-start;background:#eef1f5}
    .src{font-size:12px;color:#666;margin-top:6px;border-top:1px solid #dde;padding-top:4px}
    #f{display:flex;gap:8px;margin-top:10px}
    #i{flex:1;padding:10px;border:1px solid #ccc;border-radius:6px}
    button{padding:10px 18px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
</style></head><body>
<h3>Чат по базе знаний</h3>
<div id="chat"></div>
<form id="f"><input id="i" placeholder="Спросите по документам…" autocomplete="off"><button>➤</button></form>
<script>
    const sid = localStorage.getItem('ragSid') || crypto.randomUUID();
    localStorage.setItem('ragSid', sid);
    const box = document.getElementById('chat');
    function sources(el, srcs){
        if (!srcs || !srcs.length) return;
        const s = document.createElement('div'); s.className = 'src';
        s.textContent = 'Источники: ' + srcs.map(x => `${x.fileName} #${x.chunkNo}`).join('; ');
        el.appendChild(s);
    }
    document.getElementById('f').onsubmit = async e => {
        e.preventDefault();
        const inp = document.getElementById('i');
        const q = inp.value.trim(); if (!q) return;
        inp.value = '';
        const u = document.createElement('div'); u.className = 'm u'; u.textContent = q; box.appendChild(u);
        const a = document.createElement('div'); a.className = 'm a'; a.textContent = '…ищу в документах и думаю…'; box.appendChild(a);
        box.scrollTop = box.scrollHeight;
        try {
            const r = await fetch('/api/rag/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sessionId: sid, message: q})});
            const j = await r.json();
            a.textContent = j.answer; sources(a, j.sources);
        } catch (err) { a.textContent = 'Ошибка: ' + err; }
        box.scrollTop = box.scrollHeight;
    };
</script></body></html>
